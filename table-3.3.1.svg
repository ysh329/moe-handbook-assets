<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="411" viewBox="0 0 1500 411">
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>body{margin:0;background:#fff;font-family:Arial,sans-serif;color:#16181d}table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45}th{background:#eef1f6;text-align:left;font-weight:600}th,td{border:1px solid #b8bec9;padding:10px 12px;vertical-align:top}code{font-family:monospace;font-size:14px;overflow-wrap:anywhere}</style>
<table class="glance">
<thead>
<tr>
<th>Model</th>
<th>Auxiliary loss</th>
<th>Scope</th>
<th>Selection bias</th>
<th>Quantile balancing</th>
</tr>
</thead>
<tbody>
<tr>
<td>DeepSeek-V3</td>
<td>Small sequence-wise loss, coefficient 0.0001</td>
<td>Batch-wide bias plus sequence-wise loss</td>
<td>Fixed-step expert bias</td>
<td>No, fixed-step updates</td>
</tr>
<tr>
<td>DeepSeek-V4.1-Flash</td>
<td>Small sequence-wise loss, coefficient 0.0001</td>
<td>Text and image loads balanced separately, plus sequence-wise loss</td>
<td>Separate biases per modality, update speed 0.001</td>
<td>Uses the auxiliary-loss-free bias strategy</td>
</tr>
<tr>
<td>Kimi K3</td>
<td>Described as auxiliary-loss-free</td>
<td>Global batch</td>
<td>Bias derived from score margins, applied next step</td>
<td>Yes, global-batch histogram estimation</td>
</tr>
<tr>
<td>LongCat-Flash</td>
<td>Device-level balance loss</td>
<td>Global-batch FFN targets plus device-level balance within sequences</td>
<td>PID-controlled expert bias; identity experts excluded from bias updates</td>
<td>No, PID updates</td>
</tr>
<tr>
<td>MiMo-V2.6-Pro-RL</td>
<td>Router frozen during RL</td>
<td>Preserves the pre-RL router</td>
<td>Report evaluates freezing rather than a new bias update rule</td>
<td>No new balancing update reported for RL</td>
</tr>
<tr>
<td>Qwen3 MoE</td>
<td>Global-batch balancing loss</td>
<td>Global batch</td>
<td>No selection bias in the published router</td>
<td>No, auxiliary-loss approach</td>
</tr>
</tbody>
</table>
</div>
</foreignObject>
</svg>